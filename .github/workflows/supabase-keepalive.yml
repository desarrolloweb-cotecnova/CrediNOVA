# Respaldo del keepalive de Supabase (el principal es Vercel Cron → /api/keepalive).
# Hace una consulta real a la base de datos cada 2 días para que el proyecto
# del plan Free no se pause por inactividad (Supabase pausa tras ~7 días).
#
# Requiere en GitHub → Settings → Secrets and variables → Actions:
#   SUPABASE_URL       https://TU-PROYECTO.supabase.co
#   SUPABASE_ANON_KEY  la anon key (Settings → API en Supabase)
name: Supabase keepalive

on:
  schedule:
    - cron: "43 13 */2 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secrets SUPABASE_URL y/o SUPABASE_ANON_KEY"
            exit 1
          fi
          status=$(curl -sS -o resp.txt -w '%{http_code}' --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/academic_programs?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $status"
          if [ "$status" -ge 400 ]; then
            cat resp.txt
            echo "::error::Supabase respondió $status (¿proyecto pausado?)"
            exit 1
          fi
